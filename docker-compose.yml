
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      CHROMA_DIR: /app/chroma_db
      HF_HOME: /app/hf_cache
    volumes:
      - chroma_data:/app/chroma_db
      - huggingface_cache:/app/hf_cache
    restart: unless-stopped
    
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=10)"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s


  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      RAG_API_URL: http://api:8000
      RAG_API_KEY: ${RAG_API_KEY:?RAG_API_KEY must be configured}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
  huggingface_cache:
